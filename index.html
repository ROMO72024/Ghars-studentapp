<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#641449">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>الحضور والغياب — غرس</title>

<style>
/* ══════════════════════════════════════════════════════════
   مدرسة وروضة غرس الحديثة — واجهة الحضور
   خطوط النظام فقط (بلا تحميل)، حدود بدل الظلال (رسم أسرع)
   ══════════════════════════════════════════════════════════ */
:root{
  --plum:#8E1F6E; --plum-deep:#641449; --plum-wash:#F7F1F6;
  --leaf:#5F7F22; --leaf-wash:#EFF4E4;
  --clay:#B3261E; --clay-wash:#FCEDEC;
  --amber:#9A6700; --amber-wash:#FBF3E2;
  --ink:#241A21; --mute:#6E6270; --line:#E5DCE3;
  --paper:#fff; --r:12px;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:16px}
body{
  font-family:"Segoe UI",Tahoma,"Noto Naskh Arabic",Arial,sans-serif;
  background:var(--plum-wash); color:var(--ink);
  min-height:100vh;min-height:100dvh; overflow-x:hidden; line-height:1.45;
  -webkit-text-size-adjust:100%;
}
button,input{font:inherit;color:inherit}
button{background:none;border:0;cursor:pointer}
[hidden]{display:none!important}
:focus-visible{outline:2px solid var(--plum);outline-offset:2px}

/* ── تسجيل الدخول ─────────────────────────────────── */
#gate{
  min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;
  padding:24px 18px;background:var(--plum-deep);
}
.gate-card{
  background:var(--paper);border-radius:18px;padding:34px 26px 28px;
  width:100%;max-width:370px;text-align:center;
}
.crest{
  width:62px;height:62px;margin:0 auto 16px;border-radius:16px;
  background:var(--plum);color:#fff;display:flex;align-items:center;justify-content:center;
  font-size:1.5rem;font-weight:700;letter-spacing:-1px;
}
.gate-card h1{font-size:1.12rem;font-weight:700;color:var(--plum-deep)}
.gate-card p{font-size:.86rem;color:var(--mute);margin-top:4px;margin-bottom:26px}
.gate-card label{display:block;text-align:right;font-size:.86rem;font-weight:600;margin-bottom:7px}
#code{
  width:100%;padding:15px;border:1.5px solid var(--line);border-radius:10px;
  font-size:1.25rem;text-align:center;direction:ltr;letter-spacing:3px;
  background:#FBF9FB;transition:border-color .15s;
}
#code:focus{outline:none;border-color:var(--plum);background:#fff}
.btn-main{
  width:100%;margin-top:16px;padding:15px;border-radius:10px;
  background:var(--plum);color:#fff;font-size:1rem;font-weight:700;
}
.btn-main:active{background:var(--plum-deep)}
.btn-main:disabled{opacity:.5}
.note{
  margin-top:14px;padding:11px 13px;border-radius:9px;font-size:.85rem;
  font-weight:600;text-align:right;background:var(--clay-wash);color:var(--clay);
}

/* ── الرأس ───────────────────────────────────────── */
#app{display:none;flex-direction:column;min-height:100vh;min-height:100dvh}
#app.on{display:flex}
.top{
  background:var(--plum-deep);color:#fff;padding:12px 14px;
  display:flex;align-items:center;gap:11px;
  position:sticky;top:0;z-index:40;padding-top:12px;padding-top:max(12px,env(safe-area-inset-top));
}
.top .crest{width:36px;height:36px;border-radius:10px;margin:0;font-size:.95rem;
  background:rgba(255,255,255,.16)}
.who{flex:1;min-width:0}
.who b{display:block;font-size:.95rem;font-weight:700;line-height:1.25;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{display:block;font-size:.76rem;color:rgba(255,255,255,.72);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ico{
  width:38px;height:38px;border-radius:10px;background:rgba(255,255,255,.14);
  display:flex;align-items:center;justify-content:center;color:#fff;flex:0 0 auto;position:relative;
}
.ico:active{background:rgba(255,255,255,.3)}
.ico svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2;
  stroke-linecap:round;stroke-linejoin:round}
.ico[data-n]:not([data-n="0"])::after{
  content:attr(data-n);position:absolute;top:-5px;left:-5px;
  min-width:19px;height:19px;padding:0 5px;border-radius:10px;
  background:#E8A33D;color:#3A2A00;font-size:.68rem;font-weight:800;
  display:flex;align-items:center;justify-content:center;
}
.spinning{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* ── شريط الحالة ─────────────────────────────────── */
.wire{
  display:flex;align-items:center;gap:8px;padding:7px 15px;
  font-size:.8rem;font-weight:600;
}
.wire i{width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:currentColor}
.wire.ok  {background:var(--leaf-wash); color:var(--leaf)}
.wire.work{background:#EDF2FB;         color:#1B4DA8}
.wire.wait{background:var(--amber-wash);color:var(--amber)}
.wire.bad {background:var(--clay-wash); color:var(--clay)}

/* ── لوحة اليوم ──────────────────────────────────── */
main{flex:1;padding:12px 12px 132px;max-width:640px;width:100%;margin-inline:auto}
.day{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:12px 14px;margin-bottom:11px;
}
.day-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.day-h b{font-size:.95rem;color:var(--plum-deep)}
.day-h span{font-size:.78rem;color:var(--mute)}
.tally{display:flex;gap:7px;margin-top:11px}
.tally div{
  flex:1;text-align:center;border-radius:9px;padding:8px 4px;line-height:1.2;
}
.tally b{display:block;font-size:1.28rem;font-weight:800}
.tally span{font-size:.72rem;font-weight:600}
.t-p{background:var(--leaf-wash);color:var(--leaf)}
.t-a{background:var(--clay-wash);color:var(--clay)}
.t-e{background:var(--amber-wash);color:var(--amber)}

/* ── قائمة الطلاب ────────────────────────────────── */
#roster{display:flex;flex-direction:column;gap:8px}
.row{
  background:var(--paper);border:1px solid var(--line);border-radius:var(--r);
  padding:10px 12px 11px;contain:content;
}
.row.absent {border-color:#EFC9C6}
.row.excused{border-color:#EDDCB4}
.row-h{display:flex;align-items:center;gap:9px;margin-bottom:9px}
.n{
  width:25px;height:25px;border-radius:8px;background:var(--plum-wash);color:var(--plum);
  font-size:.74rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;
}
.row-h .nm{
  flex:1;min-width:0;font-size:.94rem;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.more{width:30px;height:30px;border-radius:8px;color:var(--mute);
  display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-size:1.15rem;line-height:1}
.more:active{background:var(--plum-wash)}

.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{
  flex:1;padding:9px 2px;font-size:.85rem;font-weight:700;color:var(--mute);
  border-right:1px solid var(--line);transition:background .1s;
}
.seg button:first-child{border-right:0}
.seg button:active{transform:scale(.97)}
.seg .on.p{background:var(--leaf); color:#fff}
.seg .on.a{background:var(--clay); color:#fff}
.seg .on.e{background:var(--amber);color:#fff}

.blank{text-align:center;padding:44px 20px;color:var(--mute);font-size:.9rem}
.blank b{display:block;font-size:1rem;color:var(--ink);margin-bottom:6px}

/* ── الشريط السفلي ───────────────────────────────── */
.dock{
  position:fixed;bottom:0;left:0;right:0;z-index:45;
  background:var(--paper);border-top:1px solid var(--line);
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;gap:8px;max-width:640px;margin-inline:auto;
}
.dock .side{
  padding:12px 14px;border-radius:10px;background:var(--plum-wash);
  color:var(--plum-deep);font-size:.87rem;font-weight:700;flex:0 0 auto;
}
.dock .side:active{background:#EEE2EC}
.submit{
  flex:1;padding:13px;border-radius:10px;background:var(--plum);color:#fff;
  font-size:.97rem;font-weight:700;
}
.submit:active{background:var(--plum-deep)}
.submit.done{background:var(--leaf-wash);color:var(--leaf)}

/* ── النوافذ ─────────────────────────────────────── */
.veil{
  position:fixed;inset:0;z-index:200;background:rgba(36,26,33,.5);
  display:flex;align-items:flex-end;justify-content:center;
  opacity:0;visibility:hidden;transition:opacity .18s,visibility .18s;
}
.veil.open{opacity:1;visibility:visible}
.sheet{
  background:var(--paper);width:100%;max-width:480px;
  border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom));
  max-height:88vh;max-height:88dvh;overflow-y:auto;transform:translateY(14px);transition:transform .18s;
}
.veil.open .sheet{transform:none}
.grip{width:38px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 16px}
.sheet h2{font-size:1rem;font-weight:700;color:var(--plum-deep);margin-bottom:14px}
.sheet label{display:block;font-size:.85rem;font-weight:600;margin-bottom:7px}
.sheet input{
  width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;
  font-size:.95rem;background:#FBF9FB;margin-bottom:14px;
}
.sheet input:focus{outline:none;border-color:var(--plum);background:#fff}
.pair{display:flex;gap:9px;margin-top:4px}
.pair button{flex:1;padding:13px;border-radius:10px;font-size:.93rem;font-weight:700}
.go{background:var(--plum);color:#fff}
.go:disabled{opacity:.5}
.no{background:#F1EDF0;color:var(--ink)}
.warn{
  background:var(--amber-wash);color:var(--amber);border-radius:9px;
  padding:10px 12px;font-size:.83rem;font-weight:600;margin-bottom:14px;
}
.menu button{
  display:flex;align-items:center;gap:11px;width:100%;padding:14px 12px;
  border-radius:10px;font-size:.93rem;font-weight:600;text-align:right;
}
.menu button:active{background:var(--plum-wash)}
.menu .danger{color:var(--clay)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}

.absentees{margin-top:6px}
.absentees h3{font-size:.86rem;font-weight:700;margin:14px 0 8px}
.absentees div{
  display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:9px 12px;border-radius:9px;background:#F8F5F8;margin-bottom:5px;font-size:.88rem;
}
.absentees em{font-style:normal;font-size:.75rem;font-weight:700;padding:2px 9px;border-radius:8px}
.e-a{background:var(--clay-wash);color:var(--clay)}
.e-e{background:var(--amber-wash);color:var(--amber)}
.allgood{text-align:center;padding:16px;color:var(--leaf);font-weight:700}

/* ── التنبيهات ───────────────────────────────────── */
#toasts{
  position:fixed;top:12px;left:12px;right:12px;z-index:400;
  display:flex;flex-direction:column;align-items:center;gap:7px;pointer-events:none;
}
.toast{
  padding:11px 18px;border-radius:10px;font-size:.87rem;font-weight:600;
  color:#fff;background:var(--ink);max-width:380px;text-align:center;
}
.toast.good{background:var(--leaf)}
.toast.bad {background:var(--clay)}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<body>

<!-- ═══════════ تسجيل الدخول ═══════════ -->
<section id="gate">
  <div class="gate-card">
    <div class="crest">غرس</div>
    <h1>مدرسة وروضة غرس الحديثة</h1>
    <p>سجل الحضور والغياب</p>
    <label for="code">رقم المعلمة</label>
    <input id="code" type="text" inputmode="text" autocomplete="off"
           enterkeyhint="go" placeholder="مثال: F1981">
    <button class="btn-main" id="enter">دخول</button>
    <div class="note" id="gate-note" hidden></div>
  </div>
</section>

<!-- ═══════════ التطبيق ═══════════ -->
<div id="app">
  <header class="top">
    <div class="crest">غ</div>
    <div class="who">
      <b id="t-name"></b>
      <span id="t-class"></span>
    </div>
    <button class="ico" id="btn-sync" data-n="0" aria-label="مزامنة">
      <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg>
    </button>
    <button class="ico" id="btn-menu" aria-label="خيارات">
      <svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
    </button>
  </header>

  <div class="wire ok" id="wire"><i></i><span id="wire-txt">محفوظ</span></div>

  <main>
    <div class="day">
      <div class="day-h">
        <b id="d-day"></b>
        <span id="d-count"></span>
      </div>
      <div class="tally">
        <div class="t-p"><b id="c-p">0</b><span>حاضر</span></div>
        <div class="t-a"><b id="c-a">0</b><span>غائب</span></div>
        <div class="t-e"><b id="c-e">0</b><span>مأذون</span></div>
      </div>
    </div>
    <div id="roster"></div>
  </main>

  <div class="dock">
    <button class="side" id="btn-add">إضافة طالب</button>
    <button class="side" id="btn-sum">الملخص</button>
    <button class="submit" id="btn-submit">تسليم الحضور</button>
  </div>
</div>

<div id="toasts"></div>

<!-- ═══════════ النوافذ ═══════════ -->
<div class="veil" id="v-add"><div class="sheet">
  <div class="grip"></div><h2>إضافة طالب</h2>
  <label for="i-add">اسم الطالب</label>
  <input id="i-add" type="text" autocomplete="off" placeholder="الاسم الكامل">
  <div class="pair"><button class="go" id="do-add">إضافة</button><button class="no" data-close>إلغاء</button></div>
</div></div>

<div class="veil" id="v-ren"><div class="sheet">
  <div class="grip"></div><h2>تعديل اسم الطالب</h2>
  <div class="warn">سيُحدَّث الاسم في كل سجلات الحضور السابقة.</div>
  <label for="i-ren">الاسم الجديد</label>
  <input id="i-ren" type="text" autocomplete="off">
  <div class="pair"><button class="go" id="do-ren">حفظ</button><button class="no" data-close>إلغاء</button></div>
</div></div>

<div class="veil" id="v-who"><div class="sheet">
  <div class="grip"></div><h2 id="who-h"></h2>
  <label id="who-l" for="i-who"></label>
  <input id="i-who" type="text" autocomplete="off">
  <div class="pair"><button class="go" id="do-who">حفظ</button><button class="no" data-close>إلغاء</button></div>
</div></div>

<div class="veil" id="v-row"><div class="sheet menu">
  <div class="grip"></div><h2 id="row-h"></h2>
  <button id="row-ren">تعديل الاسم</button>
  <button class="danger" id="row-del">حذف من القائمة</button>
  <hr>
  <button data-close>إلغاء</button>
</div></div>

<div class="veil" id="v-menu"><div class="sheet menu">
  <div class="grip"></div><h2>خيارات</h2>
  <button id="m-teacher">تعديل اسم المعلمة</button>
  <button id="m-class">تعديل اسم الصف</button>
  <button id="m-pull">تحديث البيانات من الشيت</button>
  <hr>
  <button class="danger" id="m-out">تسجيل الخروج</button>
  <button data-close>إغلاق</button>
</div></div>

<div class="veil" id="v-sum"><div class="sheet">
  <div class="grip"></div><h2>ملخص اليوم</h2>
  <div class="tally">
    <div class="t-p"><b id="s-p">0</b><span>حاضر</span></div>
    <div class="t-a"><b id="s-a">0</b><span>غائب</span></div>
    <div class="t-e"><b id="s-e">0</b><span>مأذون</span></div>
  </div>
  <div class="absentees" id="s-list"></div>
  <div class="pair"><button class="no" data-close>إغلاق</button></div>
</div></div>

<script>
/* ══════════════════════════════════════════════════════════
   ① الإعداد — ضع هنا رابط النشر (/exec) الخاص بـ Apps Script
   ══════════════════════════════════════════════════════════ */
var API = "https://script.google.com/macros/s/AKfycbyDgTDayo67c4HDgnS2DB0Vpu_fdA0mupgf7FfiCfrsf4cIRoPlTqfMq-7E_dik42I61g/exec";

/* ══════════ التخزين المحلي ══════════ */
var K_STATE = "ghars.state.v3";
var K_QUEUE = "ghars.queue.v3";

function load(k, dflt){ try{ var r=localStorage.getItem(k); return r?JSON.parse(r):dflt; }catch(e){ return dflt; } }
function save(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }

var S = load(K_STATE, null) || {
  teacherId:"", teacherName:"", className:"",
  students:[], marks:{}, date:"", submitted:false
};

function persist(){ save(K_STATE, S); }

/* ══════════ أدوات ══════════ */
var DAYS = ["الأحد","الاثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
function today(){
  var d=new Date();
  return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);
}
function dayName(iso){ var p=iso.split("-"); return DAYS[new Date(p[0],p[1]-1,p[2]).getDay()]; }
function pretty(iso){ var p=iso.split("-"); return (+p[2])+"/"+(+p[1])+"/"+p[0]; }
function esc(s){
  return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function $(id){ return document.getElementById(id); }

function toast(msg, kind){
  var t=document.createElement("div");
  t.className="toast"+(kind?" "+kind:"");
  t.textContent=msg;
  $("toasts").appendChild(t);
  setTimeout(function(){ t.remove(); }, 2600);
}

/* ══════════ الاتصال بالخادم ══════════ */
function call(payload, ms){
  var ctl = ("AbortController" in window) ? new AbortController() : null;
  var to  = ctl ? setTimeout(function(){ ctl.abort(); }, ms||20000) : null;

  return fetch(API, {
    method:"POST",
    redirect:"follow",
    headers:{ "Content-Type":"text/plain;charset=utf-8" },
    body:JSON.stringify(payload),
    signal: ctl ? ctl.signal : undefined
  }).then(function(r){
    if(to) clearTimeout(to);
    if(!r.ok) throw netErr("HTTP "+r.status);
    return r.json();
  }).catch(function(e){
    if(to) clearTimeout(to);
    if(e && e.fatal) throw e;
    throw netErr(e && e.message ? e.message : "تعذّر الاتصال");
  });
}
function netErr(m){ var e=new Error(m); e.network=true; return e; }

/* ══════════ طابور المزامنة ══════════ */
var FATAL = {NOT_FOUND:1,BAD_STATUS:1,DUPLICATE:1,RESERVED:1,BAD_NAME:1,REQUIRED:1,
             BAD_DATE:1,TOO_LONG:1,BAD_CHARS:1,UNKNOWN_ACTION:1,NO_SHEET:1,TOO_MANY:1};

function Q(){ return load(K_QUEUE, []); }
function setQ(q){ save(K_QUEUE, q); paintWire(); }

function push(op, opts){
  var q = Q();
  if(opts && opts.replaceKey){
    q = q.filter(function(x, i){
      return (busy && i === 0) || x.replaceKey !== opts.replaceKey;   // لا نحذف عملية قيد الإرسال
    });
  }
  op.opId = uid();
  op.teacherId = S.teacherId;
  if(opts && opts.replaceKey) op.replaceKey = opts.replaceKey;
  q.push(op);
  setQ(q);
  flush(250);
}

var busy=false, timer=null, backoff=0;

function flush(delay){
  clearTimeout(timer);
  timer = setTimeout(run, delay||0);
}

function run(){
  if(busy) return;
  var q=Q();
  if(!q.length){ backoff=0; paintWire(); return; }
  if(!navigator.onLine){ paintWire(); return; }

  busy=true; paintWire("work");
  var op=q[0];

  call(op).then(function(res){
    busy=false;
    if(res && res.ok){
      drop(op.opId);
      backoff=0;
      afterOk(op, res);
      if(Q().length) flush(120);
      else { paintWire(); paintDock(); }
    }else{
      var code = (res && res.code) || "ERROR";
      if(FATAL[code]){
        drop(op.opId);
        toast((res && res.message) || "تعذّر تنفيذ العملية", "bad");
        flush(150);
      }else{
        retry();
      }
    }
  }).catch(function(){
    busy=false;
    retry();
  });
}

function drop(id){ setQ(Q().filter(function(x){ return x.opId!==id; })); }

function retry(){
  backoff = Math.min(backoff ? backoff*2 : 5000, 60000);
  paintWire(navigator.onLine ? "bad" : "wait");
  clearTimeout(timer);
  timer = setTimeout(run, backoff);
}

function afterOk(op, res){
  if(op.action==="add_student" && res.duplicate){
    toast("الاسم موجود مسبقاً في القائمة");
  }
}

/* ══════════ رسم الحالة ══════════ */
function paintWire(force){
  var n = Q().length;
  var w = $("wire"), t = $("wire-txt");
  $("btn-sync").setAttribute("data-n", String(n));
  $("btn-sync").classList.toggle("spinning", force==="work");

  var cls, txt;
  if(force==="work"){ cls="work"; txt="جارٍ المزامنة…"; }
  else if(!n){ cls="ok"; txt = S.submitted ? "تم التسليم ومزامنة كل شيء" : "محفوظ على الجهاز"; }
  else if(!navigator.onLine){ cls="wait"; txt = n+" عملية بانتظار الإنترنت"; }
  else if(force==="bad"){ cls="bad"; txt = "تعذّر الاتصال — إعادة المحاولة تلقائياً"; }
  else { cls="wait"; txt = n+" عملية قيد الإرسال"; }

  w.className = "wire "+cls;
  t.textContent = txt;
}

/* ══════════ الدخول ══════════ */
$("enter").addEventListener("click", signIn);
$("code").addEventListener("keydown", function(e){ if(e.key==="Enter") signIn(); });

function signIn(){
  var id = $("code").value.trim();
  if(!id) return;
  var b=$("enter"), note=$("gate-note");
  b.disabled=true; b.textContent="جارٍ التحقق…"; note.hidden=true;

  call({ action:"login", teacherId:id, date:today() }, 25000)
    .then(function(r){
      if(!r.ok){
        note.textContent = r.message || "الرقم غير موجود.";
        note.hidden=false;
        return;
      }
      S.teacherId=r.teacherId; S.teacherName=r.teacherName; S.className=r.className;
      S.students=r.students||[]; S.date=r.date; S.submitted=!!r.submitted;
      S.marks = fillDefaults(S.students, r.attendance||{});
      persist();
      openApp();
      if(r.classCreated) toast('أُنشئ الصف «'+r.className+'» تلقائياً', "good");
    })
    .catch(function(){
      note.textContent = navigator.onLine
        ? "تعذّر الوصول إلى الخادم. حاولي مجدداً."
        : "أول دخول يحتاج إنترنت. بعدها يعمل التطبيق بدونه.";
      note.hidden=false;
    })
    .then(reset, reset);

  function reset(){ b.disabled=false; b.textContent="دخول"; }
}

/** الافتراضي: كل الطلاب حاضرون ما لم يُسجَّل غير ذلك. */
function fillDefaults(list, existing){
  var m={};
  for(var i=0;i<list.length;i++){
    var n=list[i];
    m[n] = existing[n] || "حاضر";
  }
  return m;
}

/* ══════════ فتح التطبيق ══════════ */
function openApp(){
  $("gate").hidden=true;
  $("app").classList.add("on");
  rollDay();
  paintHeader(); paintDay(); paintRoster(); paintDock(); paintWire();
  flush(400);
}

/** يوم جديد → إعادة الجميع إلى «حاضر» مع الاحتفاظ بالطابور. */
function rollDay(){
  var t=today();
  if(S.date!==t){
    S.date=t;
    S.marks=fillDefaults(S.students,{});
    S.submitted=false;
    persist();
  }
}

function paintHeader(){
  $("t-name").textContent=S.teacherName;
  $("t-class").textContent=S.className;
}

function paintDay(){
  $("d-day").textContent = dayName(S.date)+" · "+pretty(S.date);
  $("d-count").textContent = S.students.length+" طالباً";
  var c=count();
  $("c-p").textContent=c.p; $("c-a").textContent=c.a; $("c-e").textContent=c.e;
}

function count(){
  var c={p:0,a:0,e:0};
  for(var i=0;i<S.students.length;i++){
    var s=S.marks[S.students[i]];
    if(s==="غائب") c.a++; else if(s==="مأذون") c.e++; else c.p++;
  }
  return c;
}

var CLS={"حاضر":"p","غائب":"a","مأذون":"e"};

function paintRoster(){
  var box=$("roster");
  if(!S.students.length){
    box.innerHTML='<div class="blank"><b>لا يوجد طلاب في هذا الصف بعد</b>'+
      'ابدئي بإضافة أول طالب من الشريط السفلي.</div>';
    return;
  }
  var h="";
  for(var i=0;i<S.students.length;i++){
    var n=S.students[i], st=S.marks[n]||"حاضر", k=CLS[st];
    h+='<div class="row '+(k==="a"?"absent":k==="e"?"excused":"")+'" data-i="'+i+'">'+
         '<div class="row-h">'+
           '<div class="n">'+(i+1)+'</div>'+
           '<div class="nm">'+esc(n)+'</div>'+
           '<button class="more" data-act="more" aria-label="خيارات">⋮</button>'+
         '</div>'+
         '<div class="seg">'+
           '<button data-st="حاضر"  class="'+(k==="p"?"on p":"")+'">حاضر</button>'+
           '<button data-st="غائب"  class="'+(k==="a"?"on a":"")+'">غائب</button>'+
           '<button data-st="مأذون" class="'+(k==="e"?"on e":"")+'">مأذون</button>'+
         '</div>'+
       '</div>';
  }
  box.innerHTML=h;
}

/** تحديث صف واحد فقط بدل إعادة رسم القائمة كاملة. */
function paintRow(i){
  var row=$("roster").querySelector('.row[data-i="'+i+'"]');
  if(!row) return;
  var st=S.marks[S.students[i]]||"حاضر", k=CLS[st];
  row.className="row "+(k==="a"?"absent":k==="e"?"excused":"");
  var b=row.querySelectorAll(".seg button");
  for(var j=0;j<b.length;j++){
    b[j].className = (b[j].getAttribute("data-st")===st) ? "on "+k : "";
  }
}

function paintDock(){
  var b=$("btn-submit");
  if(S.submitted && !Q().length){ b.classList.add("done"); b.textContent="تم التسليم ✓"; }
  else{ b.classList.remove("done"); b.textContent="تسليم الحضور"; }
}

/* ══════════ التفاعل مع القائمة ══════════ */
$("roster").addEventListener("click", function(e){
  var row = e.target.closest ? e.target.closest(".row") : null;
  if(!row) return;
  var i = +row.getAttribute("data-i");

  if(e.target.getAttribute("data-act")==="more"){ openRowMenu(i); return; }

  var st = e.target.getAttribute("data-st");
  if(!st) return;

  S.marks[S.students[i]] = st;
  S.submitted=false;
  persist();
  paintRow(i); paintDay(); paintDock(); paintWire();
});

/* ══════════ التسليم ══════════ */
$("btn-submit").addEventListener("click", function(){
  if(!S.students.length){ toast("لا يوجد طلاب لتسليمهم"); return; }
  var recs=[];
  for(var i=0;i<S.students.length;i++){
    recs.push({ studentName:S.students[i], status:S.marks[S.students[i]]||"حاضر" });
  }
  S.submitted = true; persist();
  push({ action:"save_attendance", date:S.date, records:recs },
       { replaceKey:"att:"+S.date });
  toast(navigator.onLine ? "تم التسليم — جارٍ الحفظ في الشيت"
                         : "تم التسليم — سيُحفظ فور عودة الإنترنت", "good");
  paintDock();
});

/* ══════════ زر المزامنة اليدوي ══════════ */
$("btn-sync").addEventListener("click", function(){
  busy=false; backoff=0;
  if(!Q().length){ pull(); return; }
  flush(0);
  toast("جارٍ المزامنة…");
});

/* ══════════ إضافة طالب ══════════ */
$("btn-add").addEventListener("click", function(){
  $("i-add").value=""; open("v-add"); setTimeout(function(){ $("i-add").focus(); },160);
});
$("do-add").addEventListener("click", function(){
  var name=$("i-add").value.trim();
  if(!name) return;
  if(S.students.indexOf(name)!==-1){ toast("الاسم موجود مسبقاً"); return; }

  S.students.push(name);
  S.marks[name]="حاضر";
  S.submitted=false;
  persist();
  paintRoster(); paintDay(); paintDock();
  shut("v-add");
  push({ action:"add_student", studentName:name });
  toast("أُضيف "+name, "good");
});

/* ══════════ قائمة الطالب ══════════ */
var rowIdx=-1;
function openRowMenu(i){
  rowIdx=i;
  $("row-h").textContent=S.students[i];
  open("v-row");
}
$("row-ren").addEventListener("click", function(){
  shut("v-row");
  $("i-ren").value=S.students[rowIdx];
  open("v-ren");
  setTimeout(function(){ $("i-ren").focus(); },160);
});
$("do-ren").addEventListener("click", function(){
  var neu=$("i-ren").value.trim(), old=S.students[rowIdx];
  if(!neu || neu===old){ shut("v-ren"); return; }

  S.students[rowIdx]=neu;
  S.marks[neu]=S.marks[old]||"حاضر";
  delete S.marks[old];
  persist();
  paintRoster(); shut("v-ren");
  push({ action:"rename_student", oldName:old, newName:neu });
  toast("تم تعديل الاسم", "good");
});
$("row-del").addEventListener("click", function(){
  var name=S.students[rowIdx];
  shut("v-row");
  if(!confirm('حذف «'+name+'» من قائمة الصف؟\nسجلات الحضور السابقة تبقى محفوظة.')) return;

  S.students.splice(rowIdx,1);
  delete S.marks[name];
  persist();
  paintRoster(); paintDay();
  push({ action:"delete_student", studentName:name });
  toast("حُذف "+name);
});

/* ══════════ قائمة الخيارات ══════════ */
$("btn-menu").addEventListener("click", function(){ open("v-menu"); });

var whoMode="";
$("m-teacher").addEventListener("click", function(){
  whoMode="teacher"; shut("v-menu");
  $("who-h").textContent="تعديل اسم المعلمة";
  $("who-l").textContent="الاسم الجديد";
  $("i-who").value=S.teacherName;
  open("v-who");
});
$("m-class").addEventListener("click", function(){
  whoMode="class"; shut("v-menu");
  $("who-h").textContent="تعديل اسم الصف";
  $("who-l").textContent="اسم الصف الجديد";
  $("i-who").value=S.className;
  open("v-who");
});
$("do-who").addEventListener("click", function(){
  var v=$("i-who").value.trim();
  if(!v){ return; }
  shut("v-who");
  if(whoMode==="teacher"){
    if(v===S.teacherName) return;
    S.teacherName=v; persist(); paintHeader();
    push({ action:"rename_teacher", newName:v });
  }else{
    if(v===S.className) return;
    S.className=v; persist(); paintHeader();
    push({ action:"rename_class", newName:v });
  }
  toast("تم الحفظ", "good");
});

$("m-pull").addEventListener("click", function(){ shut("v-menu"); pull(true); });

$("m-out").addEventListener("click", function(){
  var n=Q().length;
  var msg = n ? "لديك "+n+" عملية لم تُرسل بعد. الخروج سيبقيها محفوظة حتى الدخول التالي.\nمتابعة؟"
              : "تسجيل الخروج؟";
  if(!confirm(msg)) return;
  localStorage.removeItem(K_STATE);
  location.reload();
});

/* ══════════ تحديث من الشيت ══════════ */
function pull(loud){
  if(!navigator.onLine){ if(loud) toast("لا يوجد إنترنت الآن","bad"); return; }
  if(Q().length){ if(loud) toast("سنزامن العمليات المعلّقة أولاً"); flush(0); return; }

  paintWire("work");
  call({ action:"pull", teacherId:S.teacherId, date:today() })
    .then(function(r){
      if(!r.ok){ if(loud) toast(r.message||"تعذّر التحديث","bad"); paintWire(); return; }
      S.teacherName=r.teacherName; S.className=r.className;
      S.students=r.students||[]; S.date=r.date;
      S.marks=fillDefaults(S.students, r.attendance||{});
      S.submitted=!!r.submitted;
      persist();
      paintHeader(); paintDay(); paintRoster(); paintDock(); paintWire();
      if(loud) toast("تم التحديث من الشيت","good");
    })
    .catch(function(){ paintWire(); if(loud) toast("تعذّر الاتصال","bad"); });
}

/* ══════════ الملخص ══════════ */
$("btn-sum").addEventListener("click", function(){
  var c=count();
  $("s-p").textContent=c.p; $("s-a").textContent=c.a; $("s-e").textContent=c.e;

  var out="", any=false;
  for(var i=0;i<S.students.length;i++){
    var n=S.students[i], st=S.marks[n];
    if(st!=="غائب" && st!=="مأذون") continue;
    if(!any){ out+="<h3>غير الحاضرين</h3>"; any=true; }
    out+='<div><span>'+esc(n)+'</span><em class="'+(st==="غائب"?"e-a":"e-e")+'">'+st+'</em></div>';
  }
  if(!any) out='<div class="allgood">جميع الطلاب حاضرون اليوم</div>';
  $("s-list").innerHTML=out;
  open("v-sum");
});

/* ══════════ النوافذ ══════════ */
function open(id){ $(id).classList.add("open"); }
function shut(id){ $(id).classList.remove("open"); }

document.addEventListener("click", function(e){
  if(e.target.hasAttribute && e.target.hasAttribute("data-close")){
    var v=e.target.closest(".veil"); if(v) v.classList.remove("open");
  }
});
var veils=document.querySelectorAll(".veil");
for(var vi=0; vi<veils.length; vi++){
  veils[vi].addEventListener("click", function(e){
    if(e.target===this) this.classList.remove("open");
  });
}

/* ══════════ الشبكة ودورة الحياة ══════════ */
window.addEventListener("online", function(){
  backoff=0; toast("عاد الاتصال — جارٍ المزامنة"); flush(300);
});
window.addEventListener("offline", function(){ paintWire(); });

document.addEventListener("visibilitychange", function(){
  if(document.visibilityState==="visible" && S.teacherId){
    rollDay(); paintDay(); paintRoster(); paintDock();
    if(Q().length) flush(500);
  }
});

setInterval(function(){ if(Q().length && navigator.onLine && !busy) flush(0); }, 45000);

/* ══════════ الإقلاع ══════════ */
if(S.teacherId){ $("gate").hidden=true; openApp(); }
else { $("code").focus(); }

if("serviceWorker" in navigator){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){});
  });
}
</script>
</body>
</html>
