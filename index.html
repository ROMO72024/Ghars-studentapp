<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>غرس - تسجيل الحضور</title>
    
    <!-- ربط Tailwind -->
    <script src="tailwind.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- خطوط وأيقونات -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="manifest" href="manifest.json">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800&display=swap');
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: #f8fafc; 
            -webkit-tap-highlight-color: transparent;
        }
        
        /* تنسيق أزرار الحضور لتعمل بسرعة وبدون ثقل الرسوميات */
        input:checked + span { color: white; }
        input[value="حاضر"]:checked + span { background-color: #10b981; border-color: #10b981; }
        input[value="مأذون"]:checked + span { background-color: #f59e0b; border-color: #f59e0b; }
        input[value="غائب"]:checked + span { background-color: #ef4444; border-color: #ef4444; }
        
        /* أنيميشن خفيف جدا للتحميل */
        .loader { 
            border: 3px solid #e2e8f0; 
            border-top: 3px solid #0f3d2e; 
            border-radius: 50%; 
            width: 24px; height: 24px; 
            animation: spin 1s linear infinite; 
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        
        /* إخفاء شريط التمرير للحصول على شكل تطبيق حقيقي */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="text-slate-800 antialiased pb-24">

    <!-- الرأس (Header) -->
    <header class="bg-[#0f3d2e] text-white p-4 shadow-md rounded-b-2xl">
        <div class="flex justify-between items-center mb-4">
            <div class="flex items-center gap-3">
                <img src="logo.png" alt="غرس" class="w-10 h-10 rounded-full bg-white p-1 object-contain" onerror="this.src='https://via.placeholder.com/40?text=G'">
                <h1 class="text-xl font-bold">روضة ومدرسة غرس</h1>
            </div>
            <button onclick="syncData()" id="syncBtn" class="bg-white/20 hover:bg-white/30 p-2 rounded-xl transition flex items-center justify-center w-10 h-10">
                <i class="fa-solid fa-rotate"></i>
            </button>
        </div>
        
        <div class="grid grid-cols-2 gap-3 mt-2">
            <!-- كارت المعلمة -->
            <div class="bg-white/10 p-3 rounded-xl flex justify-between items-center border border-white/5">
                <div>
                    <p class="text-[10px] text-white/70 mb-1">المعلمة المسؤولة</p>
                    <p class="font-bold text-sm" id="displayTeacher">جاري التحميل...</p>
                </div>
                <button onclick="editInfo('teacherName')" class="text-white/50 hover:text-white p-1"><i class="fa-solid fa-pen text-xs"></i></button>
            </div>
            <!-- كارت الفصل -->
            <div class="bg-white/10 p-3 rounded-xl flex justify-between items-center border border-white/5">
                <div>
                    <p class="text-[10px] text-white/70 mb-1">الفصل الحالي</p>
                    <p class="font-bold text-sm" id="displayClass">جاري التحميل...</p>
                </div>
                <button onclick="editInfo('className')" class="text-white/50 hover:text-white p-1"><i class="fa-solid fa-pen text-xs"></i></button>
            </div>
        </div>
    </header>

    <!-- شريط التاريخ وإضافة طالب -->
    <div class="px-4 mt-4 flex justify-between items-center">
        <div class="bg-white px-3 py-2 rounded-xl shadow-sm border border-slate-200 font-bold text-[#0f3d2e] text-xs flex gap-2 items-center">
            <i class="fa-regular fa-calendar text-slate-400"></i>
            <span id="displayDate"></span>
        </div>
        <button onclick="showPrompt('addStudent')" class="bg-[#0f3d2e] text-white px-3 py-2 rounded-xl text-xs font-bold shadow-sm active:scale-95 transition flex gap-1 items-center">
            <i class="fa-solid fa-user-plus"></i> طالب جديد
        </button>
    </div>

    <!-- قائمة الطلاب (سيتم رسمها بسرعة البرق هنا) -->
    <div class="px-4 mt-4" id="studentsListContainer">
        <div class="flex flex-col items-center justify-center py-10 opacity-50">
            <div class="loader mb-3"></div>
            <p class="text-xs font-bold">جاري تجهيز القائمة...</p>
        </div>
    </div>

    <!-- زر الحفظ العائم في الأسفل -->
    <div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-slate-100 via-slate-50 to-transparent z-10">
        <button onclick="saveAttendance()" class="w-full bg-[#0f3d2e] text-white font-bold py-3.5 rounded-xl shadow-lg active:scale-95 transition-all text-sm flex items-center justify-center gap-2">
            <i class="fa-solid fa-floppy-disk"></i> حفظ الحضور بالكامل
        </button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-xs font-bold shadow-xl transition-all transform -translate-y-20 opacity-0 z-50 flex items-center gap-2 pointer-events-none w-max max-w-[90%]">
        <i class="fa-solid fa-circle-info text-blue-400" id="toastIcon"></i>
        <span id="toastMsg">رسالة التنبيه</span>
    </div>

    <!-- SCRIPT LOGIC -->
    <script>
        // ==========================================
        // ⚠️ مهم جداً: ضع رابط سكربت جوجل الخاص بك هنا
        // ==========================================
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwTezSxIIkrM9d9Y0OFqq2BynFp6yhstSzg3DgKzHlJDnOlCMhJo2f8Hd7x63l66HKSvg/exec';

        // المتغيرات الأساسية
        let currentTeacher = localStorage.getItem('ghars_teacher') || 'اسم المعلمة';
        let currentClass = localStorage.getItem('ghars_class') || 'اسم الفصل';
        let studentsData = JSON.parse(localStorage.getItem('ghars_students') || '[]');
        
        // إعداد التاريخ
        const dateObj = new Date();
        const formattedDate = dateObj.toLocaleDateString('en-GB');
        const days = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const currentDay = days[dateObj.getDay()];

        // تهيئة الواجهة
        document.getElementById('displayDate').innerText = `${currentDay} - ${formattedDate}`;
        document.getElementById('displayTeacher').innerText = currentTeacher;
        document.getElementById('displayClass').innerText = currentClass;

        // دالة عرض الإشعارات
        function showToast(msg, isError = false) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').innerText = msg;
            document.getElementById('toastIcon').className = isError ? "fa-solid fa-circle-xmark text-red-400" : "fa-solid fa-circle-check text-green-400";
            toast.style.transform = 'translate(-50%, 0)';
            toast.style.opacity = '1';
            setTimeout(() => {
                toast.style.transform = 'translate(-50%, -100px)';
                toast.style.opacity = '0';
            }, 3000);
        }

        // ==========================================
        // الدالة المحسنة لرسم الطلاب (تحل مشكلة اللاج تماماً)
        // ==========================================
        function renderStudents() {
            const container = document.getElementById('studentsListContainer');
            
            // فلترة الطلاب بناءً على الفصل الحالي
            let classStudents = studentsData.filter(s => s.className === currentClass).map(s => s.studentName);

            if (classStudents.length === 0) {
                container.innerHTML = `<div class="bg-white p-6 rounded-xl border border-slate-200 text-center shadow-sm">
                    <i class="fa-solid fa-users-slash text-slate-300 text-3xl mb-2"></i>
                    <p class="text-slate-500 text-xs font-bold">لا يوجد طلاب مسجلين في هذا الفصل.</p>
                </div>`;
                return;
            }

            // البحث عن حالة الحضور المحفوظة محلياً (إن وجدت)
            let queue = JSON.parse(localStorage.getItem('ghars_offline_queue') || '[]');
            let pendingBatch = queue.find(item => item.action === 'batch_attendance' && item.records[0].className === currentClass && item.records[0].date === formattedDate);
            
            let statusMap = {};
            if (pendingBatch && pendingBatch.records) {
                pendingBatch.records.forEach(r => { statusMap[r.studentName] = r.status; });
            }

            // بناء الـ HTML دفعة واحدة في الذاكرة (بدون إرهاق المتصفح)
            let htmlHTML = '';
            classStudents.forEach((student, index) => {
                let status = statusMap[student] || 'حاضر';
                const isPresent = status === 'حاضر' ? 'checked' : '';
                const isExcused = status === 'مأذون' ? 'checked' : '';
                const isAbsent = status === 'غائب' ? 'checked' : '';

                htmlHTML += `
                    <div class="flex items-center justify-between bg-white p-2.5 rounded-xl border border-slate-200 shadow-sm mb-2">
                        <span class="font-bold text-[#0f3d2e] text-xs truncate max-w-[40%]">${index + 1}. ${student}</span>
                        <div class="flex items-center gap-2">
                            <div class="flex gap-1 bg-slate-50 p-1 rounded-lg border border-slate-100">
                                <label class="relative cursor-pointer">
                                    <input type="radio" name="attendance_${index}" value="حاضر" ${isPresent} class="peer sr-only">
                                    <span class="block px-2 py-1 rounded text-[10px] font-bold text-slate-400 border border-transparent transition-colors">حاضر</span>
                                </label>
                                <label class="relative cursor-pointer">
                                    <input type="radio" name="attendance_${index}" value="مأذون" ${isExcused} class="peer sr-only">
                                    <span class="block px-2 py-1 rounded text-[10px] font-bold text-slate-400 border border-transparent transition-colors">مأذون</span>
                                </label>
                                <label class="relative cursor-pointer">
                                    <input type="radio" name="attendance_${index}" value="غائب" ${isAbsent} class="peer sr-only">
                                    <span class="block px-2 py-1 rounded text-[10px] font-bold text-slate-400 border border-transparent transition-colors">غائب</span>
                                </label>
                            </div>
                            <button onclick="deleteStudent('${student}')" class="w-7 h-7 rounded-lg bg-red-50 text-red-400 hover:bg-red-500 hover:text-white transition-colors flex items-center justify-center shrink-0">
                                <i class="fa-solid fa-trash-can text-[10px]"></i>
                            </button>
                        </div>
                    </div>
                `;
            });
            
            // حقن الكود مرة واحدة في الشاشة
            container.innerHTML = htmlHTML;
        }

        // ==========================================
        // حفظ الحضور في الطابور المحلي
        // ==========================================
        function saveAttendance() {
            let records = [];
            let classStudents = studentsData.filter(s => s.className === currentClass).map(s => s.studentName);
            
            if(classStudents.length === 0) {
                showToast('لا يوجد طلاب لحفظ حضورهم!', true);
                return;
            }

            classStudents.forEach((student, index) => {
                let statusRadio = document.querySelector(`input[name="attendance_${index}"]:checked`);
                let status = statusRadio ? statusRadio.value : 'حاضر';
                
                records.push({
                    studentName: student,
                    className: currentClass,
                    date: formattedDate,
                    day: currentDay,
                    status: status,
                    teacherName: currentTeacher
                });
            });
            
            let queue = JSON.parse(localStorage.getItem('ghars_offline_queue') || '[]');
            // إزالة السجل القديم لنفس اليوم والفصل إن وجد لمنع التكرار
            queue = queue.filter(item => !(item.action === 'batch_attendance' && item.records && item.records.length > 0 && item.records[0].className === currentClass && item.records[0].date === formattedDate));
            
            queue.push({ action: 'batch_attendance', records: records });
            localStorage.setItem('ghars_offline_queue', JSON.stringify(queue));
            
            showToast('تم حفظ الحضور محلياً. جاهز للمزامنة!');
            renderStudents(); // تحديث الألوان
        }

        // ==========================================
        // تعديل البيانات (اسم المعلمة أو الفصل)
        // ==========================================
        function editInfo(type) {
            let title = type === 'teacherName' ? 'اسم المعلمة الجديد:' : 'اسم الفصل الجديد:';
            let currentValue = type === 'teacherName' ? currentTeacher : currentClass;
            
            let newValue = prompt(title, currentValue);
            if (newValue && newValue.trim() !== "" && newValue !== currentValue) {
                let queue = JSON.parse(localStorage.getItem('ghars_offline_queue') || '[]');
                
                queue.push({
                    action: 'update_teacher_info',
                    teacherId: currentTeacher, // نستخدم الاسم القديم كمعرف
                    updateType: type,
                    oldValue: currentValue,
                    newValue: newValue.trim()
                });
                
                localStorage.setItem('ghars_offline_queue', JSON.stringify(queue));

                if (type === 'teacherName') {
                    currentTeacher = newValue.trim();
                    localStorage.setItem('ghars_teacher', currentTeacher);
                    document.getElementById('displayTeacher').innerText = currentTeacher;
                } else {
                    // تحديث أسماء الفصول للطلاب محلياً
                    studentsData = studentsData.map(s => {
                        if (s.className === currentClass) s.className = newValue.trim();
                        return s;
                    });
                    localStorage.setItem('ghars_students', JSON.stringify(studentsData));
                    
                    currentClass = newValue.trim();
                    localStorage.setItem('ghars_class', currentClass);
                    document.getElementById('displayClass').innerText = currentClass;
                    renderStudents();
                }
                showToast('تم التعديل! يرجى المزامنة لتحديث القاعدة.');
            }
        }

        // ==========================================
        // إضافة أو حذف طالب
        // ==========================================
        function showPrompt(action) {
            if(action === 'addStudent') {
                let name = prompt('أدخل اسم الطالب الجديد:');
                if(name && name.trim() !== '') {
                    studentsData.push({ className: currentClass, studentName: name.trim() });
                    localStorage.setItem('ghars_students', JSON.stringify(studentsData));
                    
                    let queue = JSON.parse(localStorage.getItem('ghars_offline_queue') || '[]');
                    queue.push({ action: 'add_student', className: currentClass, studentName: name.trim() });
                    localStorage.setItem('ghars_offline_queue', JSON.stringify(queue));
                    
                    renderStudents();
                    showToast('تمت إضافة الطالب.');
                }
            }
        }

        function deleteStudent(studentName) {
            if(confirm(`هل أنت متأكد من حذف الطالب ${studentName}؟`)) {
                studentsData = studentsData.filter(s => !(s.studentName === studentName && s.className === currentClass));
                localStorage.setItem('ghars_students', JSON.stringify(studentsData));
                
                let queue = JSON.parse(localStorage.getItem('ghars_offline_queue') || '[]');
                queue.push({ action: 'delete_student', className: currentClass, studentName: studentName });
                localStorage.setItem('ghars_offline_queue', JSON.stringify(queue));
                
                renderStudents();
                showToast('تم حذف الطالب.');
            }
        }

        // ==========================================
        // مزامنة البيانات مع Google Sheets
        // ==========================================
        async function syncData() {
            if(!navigator.onLine) {
                showToast('لا يوجد اتصال بالإنترنت!', true);
                return;
            }

            let queue = JSON.parse(localStorage.getItem('ghars_offline_queue') || '[]');
            const syncBtn = document.getElementById('syncBtn');
            const syncIcon = syncBtn.querySelector('i');
            
            syncIcon.classList.add('fa-spin');
            syncBtn.classList.add('opacity-50', 'pointer-events-none');

            // إذا الطابور فارغ، نجلب البيانات الجديدة فقط
            if (queue.length === 0) {
                try {
                    let response = await fetch(SCRIPT_URL);
                    let result = await response.json();
                    
                    if (result.students) {
                        // تحويل مصفوفة الطلاب القادمة من جوجل شيت إلى كائنات
                        studentsData = result.students.slice(1).map(row => ({
                            className: row[0],
                            studentName: row[1]
                        }));
                        localStorage.setItem('ghars_students', JSON.stringify(studentsData));
                        renderStudents();
                        showToast('تم تحديث البيانات بنجاح!');
                    }
                } catch (error) {
                    showToast('خطأ في جلب البيانات', true);
                }
            } else {
                // إرسال البيانات المعلقة في الطابور واحدة تلو الأخرى
                showToast(`جاري مزامنة ${queue.length} عملية...`);
                let successCount = 0;
                
                for (let i = 0; i < queue.length; i++) {
                    try {
                        let response = await fetch(SCRIPT_URL, {
                            method: 'POST',
                            body: JSON.stringify(queue[i])
                        });
                        let result = await response.json();
                        if(result.status === 'success') {
                            successCount++;
                        }
                    } catch (error) {
                        console.error('Sync Error:', error);
                        break; // التوقف في حال انقطاع النت فجأة
                    }
                }
                
                // إزالة ما تم نجاحه من الطابور
                queue.splice(0, successCount);
                localStorage.setItem('ghars_offline_queue', JSON.stringify(queue));
                
                if (queue.length === 0) {
                    showToast('تمت المزامنة بالكامل!');
                } else {
                    showToast(`تبقت ${queue.length} عملية لم تكتمل.`, true);
                }
            }

            syncIcon.classList.remove('fa-spin');
            syncBtn.classList.remove('opacity-50', 'pointer-events-none');
        }

        // ==========================================
        // تسجيل Service Worker ليعمل التطبيق كـ Offline PWA
        // ==========================================
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('Service Worker Registered'))
                .catch(err => console.log('Service Worker Error', err));
            });
        }

        // بدء التشغيل
        window.onload = () => {
            // رسم مبدئي سريع
            if(studentsData.length > 0) {
                renderStudents();
            } else {
                // محاولة الجلب لو النت شغال
                if(navigator.onLine) syncData();
                else document.getElementById('studentsListContainer').innerHTML = '<p class="text-center text-sm mt-5">لا يوجد بيانات محلية، يرجى الاتصال بالإنترنت والمزامنة.</p>';
            }
        };
    </script>
</body>
</html>
