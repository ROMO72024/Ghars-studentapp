<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تطبيق الحضور والغياب | غرس</title>
    <!-- Tailwind & FontAwesome -->
    <link rel="icon" href="logo.jpg" type="image/jpeg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        
        :root {
            --ghars-green: #0f3d2e;
            --ghars-magenta: #be185d;
        }
        body { 
            font-family: 'Tajawal', sans-serif; 
            background-color: #f0fdf4;
            overflow-x: hidden;
        }
        
        /* تأثيرات الخلفية البلورية */
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 20px 40px rgba(15, 61, 46, 0.1);
        }

        .blob-1 { background: var(--ghars-magenta); animation: blob 7s infinite; }
        .blob-2 { background: var(--ghars-green); animation: blob 7s infinite 2s; }
        .blob-3 { background: #34d399; animation: blob 7s infinite 4s; }

        @keyframes blob {
            0% { transform: translate(0px, 0px) scale(1); }
            33% { transform: translate(30px, -50px) scale(1.1); }
            66% { transform: translate(-20px, 20px) scale(0.9); }
            100% { transform: translate(0px, 0px) scale(1); }
        }

        /* تخصيص الـ Radio Buttons */
        input[type="radio"]:checked + span {
            background-color: var(--ghars-green);
            color: white;
            border-color: var(--ghars-green);
        }
        input[type="radio"].absent:checked + span {
            background-color: var(--ghars-magenta);
            color: white;
            border-color: var(--ghars-magenta);
        }
    </style>
</head>
<body class="min-h-screen relative flex flex-col justify-between text-slate-800">

    <!-- الخلفية البلورية المتحركة -->
    <div class="fixed inset-0 w-full h-full z-0 overflow-hidden pointer-events-none">
        <div class="absolute top-[-10%] left-[-10%] w-96 h-96 rounded-full mix-blend-multiply filter blur-3xl opacity-30 blob-1"></div>
        <div class="absolute top-[20%] right-[-10%] w-96 h-96 rounded-full mix-blend-multiply filter blur-3xl opacity-20 blob-2"></div>
        <div class="absolute bottom-[-20%] left-[20%] w-96 h-96 rounded-full mix-blend-multiply filter blur-3xl opacity-30 blob-3"></div>
    </div>

    <!-- نظام الإشعارات الذكي (Toast) -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-500 opacity-0 -translate-y-10 flex items-center gap-3 px-6 py-3 rounded-2xl shadow-2xl font-bold text-white pointer-events-none">
        <i id="toastIcon" class="fa-solid fa-check-circle text-xl"></i>
        <span id="toastMessage">تمت العملية بنجاح!</span>
    </div>

    <!-- المحتوى الرئيسي (فوق الخلفية) -->
    <main class="relative z-10 max-w-lg mx-auto p-5 w-full flex-grow flex flex-col pt-10">

        <!-- Header -->
        <div class="text-center mb-8">
            <div class="inline-block p-2 rounded-3xl glass-card mb-4 shadow-lg">
                <img src="logo.jpg" alt="شعار غرس" class="w-20 h-20 rounded-2xl object-cover mx-auto">
            </div>
            <h1 class="text-2xl font-extrabold text-[#0f3d2e] drop-shadow-sm">روضة ومدرسة غرس الحديثة</h1>
            <p class="text-sm font-semibold text-[#be185d] mt-1 bg-white/50 inline-block px-4 py-1 rounded-full">تطبيق الحضور والغياب</p>
        </div>

        <!-- Login Screen -->
        <div id="loginScreen" class="glass-card rounded-3xl p-8 mb-10 transform transition-all duration-500">
            <div class="text-center mb-6">
                <h2 class="text-lg font-bold text-slate-700">مرحباً بكِ معلمتي</h2>
                <p class="text-xs text-slate-500 mt-1">يرجى إدخال كود الدخول الخاص بكِ</p>
            </div>
            
            <div class="space-y-5">
                <div class="relative">
                    <i class="fa-solid fa-lock absolute right-4 top-1/2 transform -translate-y-1/2 text-slate-400"></i>
                    <input type="password" id="teacherIdInput" placeholder="كود المعلمة..." class="w-full pl-4 pr-12 py-4 rounded-2xl border-2 border-white/50 focus:border-[#0f3d2e] focus:outline-none bg-white/60 text-center text-xl tracking-widest font-bold text-[#0f3d2e] shadow-inner transition-all">
                </div>
                <button onclick="handleLogin()" class="w-full bg-gradient-to-l from-[#0f3d2e] to-[#185c46] hover:scale-[1.02] text-white font-bold py-4 rounded-2xl transition-all duration-300 shadow-xl shadow-[#0f3d2e]/30 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> دخول للنظام
                </button>
            </div>
        </div>

        <!-- Dashboard Screen -->
        <div id="dashboardScreen" class="hidden space-y-5 mb-10 animate-fade-in-up">
            
            <!-- معلومات المعلمة والتاريخ -->
            <div class="glass-card rounded-3xl p-5 flex flex-col gap-4">
                <div class="flex justify-between items-center border-b border-white/40 pb-4">
                    <div class="flex items-center gap-3">
                        <div class="w-12 h-12 rounded-2xl bg-gradient-to-br from-[#0f3d2e] to-[#185c46] text-white flex items-center justify-center text-xl shadow-md">
                            <i class="fa-solid fa-chalkboard-user"></i>
                        </div>
                        <div>
                            <h3 id="teacherNameDisplay" class="font-bold text-[#0f3d2e] text-lg">اسم المعلمة</h3>
                            <p class="text-xs font-bold text-[#be185d]">الفصل: <span id="classNameDisplay">--</span></p>
                        </div>
                    </div>
                    <button onclick="handleLogout()" class="w-10 h-10 bg-red-50 hover:bg-red-100 text-red-500 rounded-2xl flex items-center justify-center transition-colors shadow-sm" title="تسجيل خروج">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>

                <div class="flex justify-between items-center px-2">
                    <div class="text-xs font-bold text-slate-600 flex items-center gap-2">
                        <i class="fa-solid fa-calendar-day text-[#0f3d2e]"></i> <span id="dayDisplay">--</span>
                    </div>
                    <div class="text-xs font-bold text-slate-600 flex items-center gap-2">
                        <i class="fa-solid fa-clock text-[#be185d]"></i> <span id="dateDisplay">--</span>
                    </div>
                </div>
            </div>

            <!-- إضافة طالب -->
            <div class="glass-card rounded-3xl p-5">
                <h4 class="text-sm font-bold text-[#0f3d2e] mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-user-plus text-[#be185d]"></i> تسجيل طالب جديد
                </h4>
                <div class="flex gap-2">
                    <input type="text" id="newStudentName" placeholder="اسم الطالب الثلاثي..." class="flex-grow px-4 py-3 rounded-xl border-2 border-white/50 focus:border-[#be185d] focus:outline-none bg-white/60 text-sm font-semibold transition-all">
                    <button onclick="addNewStudent()" class="bg-[#be185d] hover:bg-[#9d174d] text-white px-5 rounded-xl text-sm font-bold transition-all shadow-lg shadow-pink-900/20">
                        إضافة
                    </button>
                </div>
            </div>

            <!-- قائمة الحضور -->
            <div class="glass-card rounded-3xl p-5">
                <h4 class="text-sm font-bold text-[#0f3d2e] mb-4 flex items-center gap-2">
                    <i class="fa-solid fa-list-check text-[#be185d]"></i> كشف الحضور والغياب
                </h4>

                <div id="studentsListContainer" class="max-h-80 overflow-y-auto space-y-3 pr-2 scrollbar-hide">
                    <!-- سيتم إضافة الطلاب هنا -->
                </div>

                <button onclick="saveAttendance()" id="saveBtn" class="w-full mt-6 bg-gradient-to-r from-[#0f3d2e] to-[#185c46] hover:scale-[1.02] text-white font-bold py-4 rounded-2xl transition-all duration-300 shadow-xl shadow-[#0f3d2e]/30 flex items-center justify-center gap-2 text-lg">
                    <i class="fa-solid fa-cloud-arrow-up"></i> حفظ وتحديث السجل
                </button>
            </div>

        </div>

    </main>

    <!-- Footer المميز -->
    <footer class="relative z-10 text-center py-6 pb-8">
        <p class="text-xs font-bold text-slate-500">Made By <span class="text-[#be185d] text-sm">ROMO7</span> &copy; 2026</p>
    </footer>

    <!-- Script -->
    <script>
        // ======= الرابط الخاص بك يوضع هنا =======
        const GAS_URL = "https://script.google.com/macros/s/AKfycbwJNzbnLEskbBuDGcOTDYIkQZ6OYvi_dF9G6NC0s1AJxk8uw-Vozei7uI8gy3MYTIKXJw/exec";

        let currentTeacher = null;
        let currentClass = null;
        let studentsData = [];

        const now = new Date();
        const year = now.getFullYear();
        const month = String(now.getMonth() + 1).padStart(2, '0');
        const dayNum = String(now.getDate()).padStart(2, '0');
        const formattedDate = `${year}-${month}-${dayNum}`;
        const daysArabic = ['الأحد', 'الإثنين', 'الثلاثاء', 'الأربعاء', 'الخميس', 'الجمعة', 'السبت'];
        const currentDayName = daysArabic[now.getDay()];

        document.getElementById('dateDisplay').innerText = formattedDate;
        document.getElementById('dayDisplay').innerText = currentDayName;

        // دالة عرض الإشعارات الاحترافية
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            const msg = document.getElementById('toastMessage');
            
            if (type === 'success') {
                toast.className = "fixed top-5 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-500 flex items-center gap-3 px-6 py-3 rounded-full shadow-2xl font-bold text-white pointer-events-none bg-gradient-to-r from-[#0f3d2e] to-[#185c46] translate-y-0 opacity-100";
                icon.className = "fa-solid fa-check-circle text-xl text-green-400";
            } else {
                toast.className = "fixed top-5 left-1/2 transform -translate-x-1/2 z-50 transition-all duration-500 flex items-center gap-3 px-6 py-3 rounded-full shadow-2xl font-bold text-white pointer-events-none bg-gradient-to-r from-[#be185d] to-red-600 translate-y-0 opacity-100";
                icon.className = "fa-solid fa-circle-exclamation text-xl text-white";
            }
            msg.innerText = message;
            
            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('-translate-y-10', 'opacity-0');
            }, 4000);
        }

        async function handleLogin() {
            const idInput = document.getElementById('teacherIdInput').value.trim();
            if (!idInput) { showToast('الرجاء إدخال الكود أولاً', 'error'); return; }

            const btn = event.currentTarget;
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> جاري التحقق...`;

            try {
                let res = await fetch(GAS_URL);
                let data = await res.json();
                
                let teacherFound = null;
                for (let i = 1; i < data.teachers.length; i++) {
                    if (String(data.teachers[i][0]).trim() === idInput || String(data.teachers[i][1]).trim() === idInput) {
                        teacherFound = { name: data.teachers[i][1] || data.teachers[i][0], className: data.teachers[i][2] || "أول 1" };
                        break;
                    }
                }

                if (!teacherFound && idInput === "1") teacherFound = { name: "ألاء سلمة", className: "أول 1" };

                if (teacherFound) {
                    currentTeacher = teacherFound.name;
                    currentClass = teacherFound.className;
                    
                    studentsData = [];
                    for (let i = 1; i < data.students.length; i++) {
                        if (String(data.students[i][0]).trim() === String(currentClass).trim()) studentsData.push(data.students[i][1]);
                    }
                    if (studentsData.length === 0) studentsData = ["أحمد محمد", "علي موسى", "محمود أحمد"];

                    document.getElementById('teacherNameDisplay').innerText = currentTeacher;
                    document.getElementById('classNameDisplay').innerText = currentClass;
                    renderStudents();

                    document.getElementById('loginScreen').classList.add('hidden');
                    document.getElementById('dashboardScreen').classList.remove('hidden');
                    showToast(`أهلاً بكِ أ. ${currentTeacher}`, 'success');
                } else {
                    showToast('كود المعلمة غير صحيح', 'error');
                }
            } catch (err) {
                showToast('خطأ في الاتصال بالخادم', 'error');
            } finally {
                btn.innerHTML = originalHTML;
            }
        }

        function renderStudents() {
            const container = document.getElementById('studentsListContainer');
            container.innerHTML = '';

            studentsData.forEach((student, index) => {
                const item = document.createElement('div');
                item.className = "flex items-center justify-between bg-white/50 p-3 rounded-2xl border border-white/60 shadow-sm transition hover:bg-white/80";
                item.innerHTML = `
                    <span class="font-bold text-[#0f3d2e] text-sm">${index + 1}. ${student}</span>
                    <div class="flex items-center gap-3">
                        <div class="flex gap-1 bg-slate-100 p-1 rounded-xl">
                            <label class="relative cursor-pointer">
                                <input type="radio" name="attendance_${index}" value="حاضر" checked class="peer sr-only">
                                <span class="block px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 border border-transparent transition-all">حاضر</span>
                            </label>
                            <label class="relative cursor-pointer">
                                <input type="radio" name="attendance_${index}" value="غائب" class="peer sr-only absent">
                                <span class="block px-3 py-1.5 rounded-lg text-xs font-bold text-slate-500 border border-transparent transition-all">غائب</span>
                            </label>
                        </div>
                        <button onclick="deleteStudent('${student}')" class="w-8 h-8 rounded-full bg-red-50 text-red-400 hover:bg-red-500 hover:text-white transition-all flex items-center justify-center" title="حذف الطالب">
                            <i class="fa-solid fa-trash-can text-xs"></i>
                        </button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        async function addNewStudent() {
            const input = document.getElementById('newStudentName');
            const studentName = input.value.trim();
            if (!studentName) { showToast('يرجى كتابة اسم الطالب', 'error'); return; }
            if (studentsData.includes(studentName)) { showToast('الطالب موجود مسبقاً', 'error'); return; }

            studentsData.push(studentName);
            renderStudents();
            input.value = '';
            
            showToast('تمت إضافة الطالب محلياً، جاري المزامنة..', 'success');
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'add_student', className: currentClass, studentName: studentName }) });
            } catch (e) { console.error(e); }
        }

        async function deleteStudent(studentName) {
            if (!confirm(`حذف الطالب ${studentName}؟`)) return;
            studentsData = studentsData.filter(s => s !== studentName);
            renderStudents();
            
            showToast('تم حذف الطالب', 'success');
            try {
                await fetch(GAS_URL, { method: 'POST', body: JSON.stringify({ action: 'delete_student', className: currentClass, studentName: studentName }) });
            } catch (e) { console.error(e); }
        }

        async function saveAttendance() {
            if (studentsData.length === 0) return;

            const btn = document.getElementById('saveBtn');
            const originalHTML = btn.innerHTML;
            btn.innerHTML = `<i class="fa-solid fa-spinner animate-spin"></i> جاري التحديث...`;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            
            let payloadList = [];
            for (let i = 0; i < studentsData.length; i++) {
                const studentName = studentsData[i];
                const radios = document.getElementsByName(`attendance_${i}`);
                let status = 'حاضر';
                for (let r of radios) { if (r.checked) { status = r.value; break; } }
                payloadList.push({ studentName, status });
            }

            try {
                for (let item of payloadList) {
                    await fetch(GAS_URL, {
                        method: 'POST',
                        body: JSON.stringify({
                            action: 'attendance',
                            studentName: item.studentName,
                            className: currentClass,
                            date: formattedDate,
                            day: currentDayName,
                            status: item.status,
                            teacherName: currentTeacher
                        })
                    });
                }
                showToast('تم حفظ الحضور والغياب بنجاح تام! ✨', 'success');
            } catch (err) {
                showToast('حدث خطأ أثناء المزامنة', 'error');
            } finally {
                btn.innerHTML = originalHTML;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }

        function handleLogout() {
            currentTeacher = null; currentClass = null; studentsData = [];
            document.getElementById('teacherIdInput').value = '';
            document.getElementById('dashboardScreen').classList.add('hidden');
            document.getElementById('loginScreen').classList.remove('hidden');
            showToast('تم تسجيل الخروج', 'success');
        }
    </script>
</body>
</html>
